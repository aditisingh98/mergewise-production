# MergeWise Render Blueprint
# Docs: https://render.com/docs/blueprint-spec

services:
  - type: web
    name: mergewise-api
    runtime: docker
    plan: free
    region: oregon
    branch: develop
    dockerfilePath: ./Dockerfile
    healthCheckPath: /actuator/health
    autoDeploy: true
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: JAVA_OPTS
        value: -Xms256m -Xmx768m -XX:+UseContainerSupport
      - key: MERGEWISE_CORS_ORIGINS
        value: "*"
      - key: GITHUB_TOKEN
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_BASE_URL
        value: https://generativelanguage.googleapis.com/v1beta/openai
      - key: OPENAI_MODEL
        value: gemini-2.0-flash
      - key: MERGEWISE_KAFKA_ENABLED
        value: "false"
      # MERGEWISE_PUBLIC_URL is auto-set from RENDER_EXTERNAL_URL via PublicUrlResolver

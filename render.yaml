# MergeWise Render Blueprint
# Docs: https://render.com/docs/blueprint-spec

services:
  - type: web
    name: mergewise-api
    runtime: docker
    plan: free
    region: oregon
    branch: develop
    dockerfilePath: ./Dockerfile
    healthCheckPath: /actuator/health
    autoDeploy: true
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: JAVA_OPTS
        value: -Xms256m -Xmx768m -XX:+UseContainerSupport
      - key: MERGEWISE_CORS_ORIGINS
        value: "*"
      - key: GITHUB_TOKEN
        sync: false
      - key: GITLAB_TOKEN
        sync: false
      # --- Recommended AI: OpenAI gpt-4o-mini (set OPENAI_API_KEY in Render dashboard) ---
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_BASE_URL
        value: https://api.openai.com/v1
      - key: OPENAI_MODEL
        value: gpt-4o-mini
      - key: OPENAI_MAX_PROMPT_CHARS
        value: "4000"
      - key: MERGEWISE_AI_ENABLED
        value: "true"
      - key: MERGEWISE_AI_REVIEW_ENABLED
        value: "true"
      # Optional fallback (same provider or different key)
      - key: OPENAI_FALLBACK_API_KEY
        sync: false
      - key: OPENAI_FALLBACK_BASE_URL
        value: https://api.openai.com/v1
      - key: OPENAI_FALLBACK_MODEL
        value: gpt-4o-mini
      - key: MERGEWISE_KAFKA_ENABLED
        value: "false"
      # MERGEWISE_PUBLIC_URL is auto-set from RENDER_EXTERNAL_URL via PublicUrlResolver

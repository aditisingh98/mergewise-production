server.port=${PORT:8090}

# Kafka disabled by default in production (REST API does not require it)
mergewise.kafka.enabled=${MERGEWISE_KAFKA_ENABLED:false}
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.kafka.KafkaAutoConfiguration

# Public URL: set explicitly or auto-detected from RENDER_EXTERNAL_URL / RAILWAY_PUBLIC_DOMAIN
mergewise.public-url=${MERGEWISE_PUBLIC_URL:}
mergewise.cors.allowed-origins=${MERGEWISE_CORS_ORIGINS:*}

# Production logging
logging.level.com.mergewise=INFO
logging.level.org.springframework=WARN
logging.level.root=WARN

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
management.endpoints.web.base-path=/actuator

# OpenAPI
springdoc.swagger-ui.enabled=true
springdoc.api-docs.enabled=true

# Graceful shutdown for container platforms
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s

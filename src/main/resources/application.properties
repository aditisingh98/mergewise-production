server.port=8090

github.token=${GITHUB_TOKEN:}

# Public URL used in deploymentInfo response (override in production)
mergewise.public-url=${MERGEWISE_PUBLIC_URL:http://localhost:8090}
mergewise.cors.allowed-origins=${MERGEWISE_CORS_ORIGINS:*}

# Kafka optional (disabled by default; enable with profile `kafka` + MERGEWISE_KAFKA_ENABLED=true)
mergewise.kafka.enabled=${MERGEWISE_KAFKA_ENABLED:false}
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.kafka.KafkaAutoConfiguration

# AI provider configuration. Works with any OpenAI-compatible chat-completions API.
openai.base-url=${OPENAI_BASE_URL:https://generativelanguage.googleapis.com/v1beta/openai}
openai.api-key=${OPENAI_API_KEY:}
openai.model=${OPENAI_MODEL:gemini-2.0-flash}
openai.max-prompt-chars=${OPENAI_MAX_PROMPT_CHARS:4000}

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.consumer.group-id=mergewise-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=com.mergewise.dto
spring.kafka.consumer.properties.spring.json.value.default.type=com.mergewise.dto.PRRequest

# Actuator / health
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when_authorized
management.info.env.enabled=true

# OpenAPI / Swagger
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Logging
logging.level.com.mergewise=INFO
logging.level.org.springframework.web=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

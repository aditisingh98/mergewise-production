server.port=8090

github.token=${GITHUB_TOKEN:}

# AI provider configuration. Works with any OpenAI-compatible chat-completions API.
# OpenAI:    OPENAI_BASE_URL=https://api.openai.com/v1                            OPENAI_MODEL=gpt-4o-mini
# Groq:      OPENAI_BASE_URL=https://api.groq.com/openai/v1                       OPENAI_MODEL=llama-3.1-8b-instant
# Gemini:    OPENAI_BASE_URL=https://generativelanguage.googleapis.com/v1beta/openai  OPENAI_MODEL=gemini-2.0-flash
# Ollama:    OPENAI_BASE_URL=http://localhost:11434/v1                            OPENAI_MODEL=llama3.1
openai.base-url=${OPENAI_BASE_URL:https://generativelanguage.googleapis.com/v1beta/openai}
openai.api-key=${OPENAI_API_KEY:}
openai.model=${OPENAI_MODEL:gemini-2.0-flash}
openai.max-prompt-chars=${OPENAI_MAX_PROMPT_CHARS:4000}

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

spring.kafka.consumer.group-id=mergewise-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*
spring.kafka.consumer.properties.spring.json.value.default.type=com.mergewise.dto.PRRequest
